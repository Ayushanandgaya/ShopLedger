<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture and order placement flow</title>
  <desc id="desc">Architecture map of the ShopLedger browser app, Express server, routers, library modules and JSON store. Numbered arrows show order placement.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#526174"/></marker>
    <marker id="flowArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#167c6b"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172536}
      .title{font-size:25px;font-weight:700}.subtitle{font-size:13px;fill:#536477}
      .section{font-size:15px;font-weight:700}.boxTitle{font-size:14px;font-weight:700}.body{font-size:12px;fill:#425368}.small{font-size:12px;fill:#536477}
      .panel{fill:#f7f9fc;stroke:#b9c5d3;stroke-width:1.4}.node{fill:#fff;stroke:#9eacbb;stroke-width:1.3}.ticket{fill:#fff1dc;stroke:#d58a19;stroke-width:2}
      .flow{fill:none;stroke:#167c6b;stroke-width:2.3;marker-end:url(#flowArrow)}.link{fill:none;stroke:#78899a;stroke-width:1.5;marker-end:url(#arrow)}
      .num{fill:#167c6b}.numText{font-size:12px;font-weight:700;fill:#fff;text-anchor:middle}.legendText{font-size:12px}
    </style>
  </defs>
  <rect width="1200" height="800" fill="#fff"/>
  <text x="30" y="38" class="title">ShopLedger | application architecture</text>
  <text x="30" y="61" class="subtitle">POS checkout, inventory, Khata ledger, GST reporting and printable invoice · arrows numbered for order placement</text>

  <!-- Browser layer -->
  <rect x="28" y="88" width="220" height="548" rx="12" class="panel"/>
  <text x="46" y="117" class="section">Browser UI</text>
  <rect x="46" y="134" width="184" height="105" rx="8" class="node"/>
  <text x="60" y="158" class="boxTitle">public/</text>
  <text x="60" y="180" class="body">index.html · POS, orders,</text><text x="60" y="197" class="body">Khata and GST audit</text>
  <text x="60" y="220" class="body">js/app.js · XHR + UI</text>
  <rect x="46" y="259" width="184" height="104" rx="8" class="node"/>
  <text x="60" y="284" class="boxTitle">Place Order</text>
  <text x="60" y="307" class="body">POST /api/orders</text>
  <text x="60" y="327" class="body">items, customer, mode,</text><text x="60" y="344" class="body">status and coupon</text>
  <rect x="46" y="385" width="184" height="92" rx="8" class="node"/>
  <text x="60" y="410" class="boxTitle">Live bill preview</text>
  <text x="60" y="433" class="body">POST /api/pricing/preview</text>
  <text x="60" y="454" class="body">same pricing library</text>
  <rect x="46" y="499" width="184" height="110" rx="8" class="node"/>
  <text x="60" y="524" class="boxTitle">Invoice link</text>
  <text x="60" y="547" class="body">GET /orders/:id/invoice</text>
  <text x="60" y="569" class="body">opens printable HTML</text>
  <text x="60" y="590" class="body">after successful checkout</text>

  <!-- Server and route layer -->
  <rect x="274" y="88" width="328" height="548" rx="12" class="panel"/>
  <text x="292" y="117" class="section">Express application</text>
  <rect x="294" y="135" width="288" height="68" rx="8" class="node"/>
  <text x="310" y="160" class="boxTitle">server.js</text>
  <text x="310" y="183" class="body">middleware · static files · mounts routes</text>
  <rect x="294" y="222" width="288" height="48" rx="7" class="node"/>
  <text x="309" y="251" class="boxTitle">routes/orders.js</text><text x="468" y="251" class="small">/api/orders</text>
  <rect x="294" y="280" width="288" height="48" rx="7" class="node"/>
  <text x="309" y="309" class="boxTitle">routes/products.js</text><text x="468" y="309" class="small">products, coupons</text>
  <rect x="294" y="338" width="288" height="48" rx="7" class="node"/>
  <text x="309" y="367" class="boxTitle">routes/customers.js</text><text x="468" y="367" class="small">Khata, settlements</text>
  <rect x="294" y="396" width="288" height="48" rx="7" class="node"/>
  <text x="309" y="425" class="boxTitle">routes/reports.js</text><text x="468" y="425" class="small">preview, reports, export</text>
  <rect x="294" y="460" width="288" height="70" rx="8" class="ticket"/>
  <text x="309" y="485" class="boxTitle">server.js invoice endpoint</text>
  <text x="309" y="508" class="body">GET /orders/:id/invoice → invoice.render()</text>
  <text x="309" y="552" class="small">All API routers mounted at /api</text>

  <!-- Lib layer -->
  <rect x="628" y="88" width="330" height="548" rx="12" class="panel"/>
  <text x="646" y="117" class="section">Business logic · lib/</text>
  <rect x="648" y="136" width="140" height="53" rx="7" class="node"/><text x="660" y="159" class="boxTitle">pricing.js</text><text x="660" y="178" class="small">subtotal, GST, total</text>
  <rect x="800" y="136" width="140" height="53" rx="7" class="node"/><text x="812" y="159" class="boxTitle">coupons.js</text><text x="812" y="178" class="small">normalize, validate</text>
  <rect x="648" y="200" width="140" height="53" rx="7" class="node"/><text x="660" y="223" class="boxTitle">inventory.js</text><text x="660" y="242" class="small">find, check, reserve</text>
  <rect x="800" y="200" width="140" height="53" rx="7" class="node"/><text x="812" y="223" class="boxTitle">orders.js</text><text x="812" y="242" class="small">add, get, cancel, list</text>
  <rect x="648" y="264" width="140" height="53" rx="7" class="node"/><text x="660" y="287" class="boxTitle">ledger.js</text><text x="660" y="306" class="small">Khata + settlement</text>
  <rect x="800" y="264" width="140" height="53" rx="7" class="node"/><text x="812" y="287" class="boxTitle">tax.js</text><text x="812" y="306" class="small">HSN slab + split</text>
  <rect x="648" y="328" width="140" height="53" rx="7" class="node"/><text x="660" y="351" class="boxTitle">reports.js</text><text x="660" y="370" class="small">dashboard + GST recon</text>
  <rect x="800" y="328" width="140" height="53" rx="7" class="node"/><text x="812" y="351" class="boxTitle">dates.js</text><text x="812" y="370" class="small">today + date keys</text>
  <rect x="648" y="392" width="140" height="53" rx="7" class="node"/><text x="660" y="415" class="boxTitle">store.js</text><text x="660" y="434" class="small">read / write JSON</text>
  <rect x="800" y="392" width="140" height="74" rx="7" class="ticket"/>
  <text x="812" y="416" class="boxTitle">invoice.js</text><text x="812" y="437" class="small">computeInvoiceFigures()</text><text x="812" y="454" class="small">render() · highlighted ticket</text>
  <text x="648" y="490" class="small">pricing.js calls tax.js + coupons.js</text>
  <text x="648" y="512" class="small">reports.js compares ledger vs invoice</text>
  <text x="648" y="534" class="small">Orders, reports and invoice use store data</text>

  <!-- Config -->
  <rect x="984" y="88" width="188" height="118" rx="12" class="panel"/>
  <text x="1002" y="117" class="section">Settings</text>
  <rect x="1002" y="135" width="152" height="52" rx="7" class="node"/>
  <text x="1015" y="159" class="boxTitle">config.js</text><text x="1015" y="178" class="small">shop · GST · coupons</text>

  <!-- Numbered checkout path -->
  <path d="M230 300H267" class="flow"/><circle cx="249" cy="286" r="12" class="num"/><text x="249" y="290" class="numText">1</text>
  <path d="M582 246H622" class="flow"/><circle cx="602" cy="231" r="12" class="num"/><text x="602" y="235" class="numText">2</text>
  <path d="M582 246C610 246 610 162 642 162" class="flow"/><circle cx="614" cy="204" r="12" class="num"/><text x="614" y="208" class="numText">3</text>
  <path d="M788 162C804 162 784 290 795 290" class="flow"/><circle cx="802" cy="211" r="12" class="num"/><text x="802" y="215" class="numText">4</text>
  <path d="M582 248C610 248 612 291 642 291" class="link"/>
  <path d="M582 248C610 248 610 162 642 162" class="link"/>
  <path d="M582 248C608 248 614 226 642 226" class="link"/>
  <path d="M582 248C620 248 770 290 795 290" class="link"/>
  <path d="M582 248C620 248 610 418 642 418" class="link"/>
  <text x="296" y="594" class="small">2 · resolve products &amp; check stock</text>
  <text x="296" y="612" class="small">3–4 · compute totals, coupon and GST</text>
  <path d="M582 246C615 246 615 291 642 291" class="flow"/><circle cx="620" cy="273" r="12" class="num"/><text x="620" y="277" class="numText">5</text>
  <text x="296" y="474" class="small">5 · optional Khata credit check</text>
  <path d="M582 246C620 246 760 226 795 226" class="flow"/><circle cx="750" cy="232" r="12" class="num"/><text x="750" y="236" class="numText">6</text>
  <path d="M718 445V645C718 654 575 654 575 660" class="flow"/><circle cx="692" cy="647" r="12" class="num"/><text x="692" y="651" class="numText">7</text>

  <!-- Data store and config relationships -->
  <rect x="28" y="660" width="1144" height="112" rx="12" class="panel"/>
  <text x="48" y="689" class="section">Persistent data</text>
  <rect x="430" y="695" width="290" height="55" rx="8" class="node"/>
  <text x="448" y="719" class="boxTitle">data/db.json</text><text x="448" y="739" class="body">products · customers · orders · settlements · auditLog</text>
  <text x="744" y="711" class="body">6 · orders.add() + inventory.reserve() + optional ledger charge</text>
  <text x="744" y="733" class="body">7 · store.appendAudit() then store.write(db) saves changes</text>
  <path d="M940 418C968 418 965 161 996 161" class="link"/>
  <path d="M940 354C966 354 966 161 996 161" class="link"/>
  <path d="M940 226C964 226 968 161 996 161" class="link"/>
  <path d="M940 418C980 418 975 720 724 720" class="link"/>
  <path d="M230 545C260 545 258 485 286 485" class="flow"/><circle cx="257" cy="527" r="12" class="num"/><text x="257" y="531" class="numText">8</text>
  <text x="296" y="570" class="small">8 · invoice route → invoice.render()</text>

  <!-- Legend -->
  <rect x="846" y="674" width="306" height="78" rx="8" fill="#fff" stroke="#c4ced9"/>
  <text x="864" y="696" class="boxTitle">Legend</text>
  <path d="M864 716H904" class="flow"/><text x="914" y="720" class="legendText">numbered order flow</text>
  <rect x="864" y="729" width="18" height="14" rx="3" class="ticket"/><text x="890" y="741" class="legendText">ticket focus: lib/invoice.js</text>
</svg>
